name: Bygg ROM

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GAME_VERSION: FIRERED
      GAME_LANGUAGE: ENGLISH
      GAME_REVISION: 0
      MODERN: 0
      COMPARE: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout agbcc
        uses: actions/checkout@v4
        with:
          path: agbcc
          repository: pret/agbcc

      - name: Installera beroenden
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils-arm-none-eabi libpng-dev

      - name: Bygg och installera agbcc
        working-directory: ./agbcc
        run: |
          ./build.sh
          ./install.sh ../

      - name: Bygg pokefirered.gba
        run: make -j$(nproc)

      - name: Ladda upp ROM
        uses: actions/upload-artifact@v4
        with:
          name: pokefirered-gba
          path: pokefirered.gba
          if-no-files-found: error
