name: Deploy Porymap Mobile

on:
  push:
    # Deploys from the feature branch too, so the app can be published without
    # having to merge first.
    branches: [main, claude/porymap-ios-app-n2fr0s]
    paths:
      - 'porymap-mobile/**'
      - '.github/workflows/deploy-porymap-mobile.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: porymap-mobile
      - id: deployment
        uses: actions/deploy-pages@v4
